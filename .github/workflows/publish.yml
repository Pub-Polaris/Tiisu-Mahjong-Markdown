name: publish-nuget

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Tiisu.Mahjong.Markdown.slnx --configuration Release

      - name: Pack
        run: dotnet pack src/Tiisu.Mahjong.Markdown/Tiisu.Mahjong.Markdown.csproj -c Release -o artifacts

      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Ensure pushed packages are listed
        shell: bash
        run: |
          set -euo pipefail
          for pkg in artifacts/*.nupkg; do
            nuspec=$(unzip -Z1 "$pkg" | grep '\.nuspec$' | head -n1)
            id=$(unzip -p "$pkg" "$nuspec" | sed -n 's:.*<id>\(.*\)</id>.*:\1:p' | head -n1)
            version=$(unzip -p "$pkg" "$nuspec" | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n1)
            echo "Relisting ${id} ${version}"
            curl --fail-with-body -X POST \
              "https://www.nuget.org/api/v2/package/${id}/${version}" \
              -H "X-NuGet-ApiKey: ${{ steps.login.outputs.NUGET_API_KEY }}"
          done
